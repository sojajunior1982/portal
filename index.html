<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>総社ジュニア保護者ポータル</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/sojajunior1982/portal/main/logo_01.png">
  <!-- SortableJS for robust drag & drop -->
  <script>const GAS_URL = "https://script.google.com/macros/s/AKfycbz2c7_4BqzbAcnj90yWS-e5iJ7ZMCtNbzuaQztCKTuRzd30tcT0eIFjBvymUI_t2LecQw/exec";</script>

  <style>
    /* ... (CSS mostly same as previous refactor, with adjustments below) ... */
    * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif; -webkit-tap-highlight-color: transparent; }
    html, body { width:100%; height:100dvh; margin:0; padding:0; background: linear-gradient(135deg,#e0eafc 0%,#cfdef3 100%); overflow:hidden; }
    body { display:flex; justify-content:center; align-items:center; }
    .app-container { background:#fafbfe; width:100%; max-width:390px; height:100%; max-height:844px; border-radius:32px; box-shadow:0 20px 40px rgba(0,0,0,.15); display:flex; flex-direction:column; position:relative; border:4px solid #fff; overflow:hidden; }
    @media (max-width:480px){ .app-container{max-width:100%;height:100dvh;max-height:100dvh;border-radius:0;border:none;box-shadow:none;} }

    .header{background:linear-gradient(135deg,#2563eb 0%,#1d4ed8 100%);color:#fff;padding:18px 16px;text-align:center;font-size:17px;font-weight:700;position:relative;box-shadow:0 4px 12px rgba(37,99,235,.15);flex-shrink:0;z-index:10;}
    .header.confirm-mode{background:linear-gradient(135deg,#7c3aed 0%,#6d28d9 100%);}
    .back-btn{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:#fff;background:rgba(255,255,255,.2);border:none;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:bold;cursor:pointer;}
    .menu-btn{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:#fff;background:none;border:none;font-size:22px;cursor:pointer;padding:0;}
    .logout-btn{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:#fff;background:rgba(255,255,255,.15);border:none;padding:6px 12px;border-radius:20px;font-size:11px;cursor:pointer;}

    .content{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch;}

    /* Login */
    .login-box{padding:20px 16px;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;height:100%;}
    .login-logo-img{width:100px;height:100px;border-radius:22px;object-fit:cover;margin-bottom:12px;box-shadow:0 8px 16px rgba(0,0,0,.1);}
    .login-logo{font-size:24px;font-weight:800;color:#1e3a8a;margin-bottom:4px;}
    .login-subtitle{font-size:13px;color:#64748b;margin-bottom:25px;}
    .login-box input{width:100%;padding:14px 16px;margin-bottom:16px;border:1.5px solid #e2e8f0;border-radius:14px;font-size:15px;background:#fff;}
    .login-box button{width:100%;padding:14px;background:linear-gradient(135deg,#2563eb 0%,#1d4ed8 100%);color:white;border:none;border-radius:14px;cursor:pointer;font-size:16px;font-weight:bold;box-shadow:0 8px 16px rgba(37,99,235,.25);}
    #message{margin-top:15px;color:#ef4444;font-size:13px;text-align:center;}

    /* month selector */
    .month-selector{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;background:#ffffff;padding:10px 12px;border-radius:14px;box-shadow:0 4px 8px rgba(0,0,0,.02);}
    .month-title{font-size:16px;font-weight:800;color:#1e293b;}
    .month-arrow{background:none;border:none;font-size:18px;cursor:pointer;color:#1e293b;padding:4px 8px;}

    /* date card (list) */
    .date-card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin-bottom:10px;cursor:pointer;box-shadow:0 4px 6px rgba(0,0,0,.02);}
    .date-card.past{opacity:.6;background:#f8fafc;}
    .date-row{display:flex;align-items:center;gap:8px;}
    .date-day{font-weight:700;color:#1e293b;width:110px;flex:0 0 110px;}
    .date-main{flex:1;overflow:hidden;}
    .date-main .title{font-weight:700;color:#1e293b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .date-meta{margin-top:8px;display:flex;gap:8px;align-items:center;font-size:13px;}

    .status-badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:100px;}
    .status-recruiting{background:#fffbeb;color:#d97706;border:1px solid #fde68a;}
    .status-confirmed{background:#ecfdf5;color:#059669;border:1px solid #a7f3d0;}

    /* tabs */
    .tab-container{display:flex;gap:6px;margin-bottom:0;overflow:hidden;padding-bottom:0;flex-shrink:0;}
    .tab{flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:10px 8px;border-radius:14px 14px 0 0;font-size:13px;font-weight:700;cursor:pointer;background:#e2e8f0;color:#475569;border:1.5px solid #cbd5e1;border-bottom:none;}
    .tab.active{background:#fff;color:#1e3a8a;border-color:#94a3b8;padding-bottom:11px;margin-bottom:-1px;position:relative;z-index:2;}

    .tab-content-box{background:#fff;border:1.5px solid #cbd5e1;border-radius:0 16px 16px 16px;padding:16px;flex:1;overflow-y:auto;box-shadow:0 6px 12px rgba(0,0,0,.01);margin-top:-1px;margin-bottom:12px;}

    .summary-status-bar{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin-top:16px;font-size:12.5px;}
    .summary-row{display:flex;justify-content:space-between;margin-bottom:4px;}

    .bottom-action-bar{background:#fff;border-top:1.5px solid #cbd5e1;padding:12px 16px 20px;display:flex;gap:10px;flex-shrink:0;z-index:10;}
    .fixed-btn{flex:1;padding:12px 4px;border-radius:14px;font-size:13.5px;font-weight:bold;cursor:pointer;text-align:center;border:none;line-height:1.4;}
    .fixed-btn-recruit{background:linear-gradient(135deg,#f97316 0%,#ea580c 100%);color:#fff;}
    .fixed-btn-absent{background:#f1f5f9;color:#475569;border:1px solid #cbd5e1;}

    /* modal */
    .modal-overlay,.all-res-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15,23,42,.4);backdrop-filter:blur(4px);z-index:100;justify-content:center;align-items:flex-end;padding:16px;}
    .modal{background:#fff;width:100%;max-width:358px;border-radius:24px;box-shadow:0 -4px 30px rgba(0,0,0,.15);box-sizing:border-box;padding:20px 16px;max-height:80dvh;margin-bottom:calc(env(safe-area-inset-bottom,0px)+20px);display:flex;flex-direction:column;overflow:hidden;}
    .modal-header{margin-bottom:14px;}
    .modal-title{font-size:17px;font-weight:800;color:#0f172a;}
    .modal-subtitle{font-size:12.5px;color:#64748b;margin-top:2px;}
    .modal-body{flex:1;overflow-y:auto;padding-right:2px;-webkit-overflow-scrolling:touch;}
    .modal-footer{padding-top:12px;display:flex;gap:10px;flex-shrink:0;}
    .modal-footer-btn{flex:1;padding:13px;border-radius:12px;font-weight:bold;font-size:14px;border:none;text-align:center;cursor:pointer;}

    .selector-group{display:flex;gap:6px;margin-bottom:8px;width:100%;}
    .sel-btn{flex:1;padding:10px 2px;border:1.5px solid #cbd5e1;border-radius:10px;background:#fff;color:#475569;font-size:13px;font-weight:700;cursor:pointer;text-align:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
    .sel-btn-full{width:100%;margin-bottom:8px;padding:11px;box-sizing:border-box;}
    .sel-btn.active-green{background:#ecfdf5;border-color:#10b981;color:#047857;}
    .sel-btn.active-red{background:#fef2f2;border-color:#f87171;color:#b91c1c;}
    .sel-btn.active-yellow{background:#fffbeb;border-color:#fbbf24;color:#b45309;}
    .sel-btn.active-blue{background:#eff6ff;border-color:#60a5fa;color:#1d4ed8;}

    .toast{display:none;position:absolute;bottom:80px;left:50%;transform:translateX(-50%) translateY(100px);background:rgba(15,23,42,.9);color:#fff;padding:10px 20px;border-radius:50px;font-size:12px;font-weight:bold;z-index:999;transition:transform .3s;}
    .toast.show{transform:translateX(-50%) translateY(0);}

    .draggable-hint{font-size:12px;color:#64748b;margin-bottom:8px;}
    .help-box{font-size:12px;color:#64748b;background:#fff;padding:8px;border-radius:8px;border:1px solid #e2e8f0;margin-bottom:12px;}

/* 強制：通知モーダルとサイドメニューを初期で閉じる（緊急対策） */
#notiModal, .noti-modal, #responseModal, .modal-overlay { display: none !important; }
#allResponseModal, .all-res-overlay { display: none !important; }
#sideMenu { left: -320px !important; transition: left 0.2s ease !important; }
#sideMenuOverlay { display: none !important; }



    
  </style>
</head>
<body>
  <div class="app-container" id="app"></div>

  <div id="sideMenuOverlay" onclick="toggleSideMenu()"></div>
  <div id="sideMenu">
    <div style="padding:24px 20px;background:#f8fafc;border-bottom:1px solid #e2e8f0;">
      <div style="font-size:12px;color:#64748b;margin-bottom:4px;">ログイン中</div>
      <div id="menuUserName" style="font-size:16px;font-weight:bold;color:#1e293b;">-</div>
    </div>
    <div style="flex:1;padding:12px 0;overflow-y:auto;">
      <a href="#" onclick="navigateMenu('schedule');return false;" style="display:block;padding:14px 20px;color:#2563eb;font-weight:bold;background:#eff6ff;text-decoration:none;border-left:4px solid #2563eb;">📅 スケジュール</a>
      <a href="#" onclick="navigateMenu('manageSchedule');return false;" style="display:block;padding:14px 20px;color:#334155;text-decoration:none;border-bottom:1px solid #f1f5f9;">⚙️ 予定の追加・管理</a>
      <a href="#" onclick="navigateMenu('confirmRoles');return false;" style="display:block;padding:14px 20px;color:#334155;text-decoration:none;border-bottom:1px solid #f1f5f9;">🤝 協力パパママ確定</a>
      <a href="#" onclick="navigateMenu('documents');return false;" style="display:block;padding:14px 20px;color:#334155;text-decoration:none;border-bottom:1px solid #f1f5f9;">各種資料</a>
      <a href="#" onclick="navigateMenu('admin');return false;" style="display:block;padding:14px 20px;color:#334155;text-decoration:none;border-bottom:1px solid #f1f5f9;">管理者用</a>
    </div>
    <div style="padding:16px;border-top:1px solid #e2e8f0;text-align:center;">
      <button onclick="handleLogout()" style="background:#fee2e2;border:1px solid #fca5a5;padding:10px 16px;border-radius:8px;color:#b91c1c;font-size:14px;width:100%;cursor:pointer;font-weight:bold;margin-bottom:10px;">ログアウト</button>
      <button onclick="toggleSideMenu()" style="background:#f1f5f9;border:none;padding:10px 16px;border-radius:8px;color:#64748b;font-size:14px;width:100%;cursor:pointer;">メニューを閉じる</button>
    </div>
  </div>

  <div class="modal-overlay" id="responseModal"><div class="modal" id="modalContent"></div></div>
  <div class="all-res-overlay" id="allResponseModal"><div class="modal" id="allResponseModalContent"></div></div>
  <div class="toast" id="toast">保存しました！</div>

  <script>
    // ------------------------
    // State
    // ------------------------
    let currentUser = null;
    let rawSchedules = [];
    let myAttendances = [];
    let allAttendances = [];
    let groupedSchedules = {};
    let currentActiveDate = null;
    let currentActiveTabIndex = 0;
    let tempAttendances = [];
    let currentAllResSort = 'number';
    let currentAllResScheduleId = null;
    let appDefaultsFull = [];
    let appDefaults = { tab:["練習","練習（雨天時）","練習試合","試合"], place:["小学校","本球場"], support:["🙆 参加","🙋 当番","🚗 道具車","⚾ 審判"] };
    let confirmStateMap = {};

    // month view state for improvement7
    let currentViewYear = (new Date()).getFullYear();
    let currentViewMonth = (new Date()).getMonth(); // 0-based

    // ------------------------
    // Utilities
    // ------------------------
    function isNewUpdate(updateStr) {
        if (!updateStr) return false;
        const updateDate = new Date(updateStr);
        if (isNaN(updateDate.getTime())) return false;
        const now = new Date();
        const diffDays = (now - updateDate) / (1000 * 60 * 60 * 24);
        return diffDays >= 0 && diffDays <= 2;
    }
    function apiPost(body) {
      return fetch(GAS_URL, { method: 'POST', body: JSON.stringify(body) }).then(r => r.json()).catch(e => { console.error(e); return null; });
    }
    function showToast(msg, duration=1400) {
      const t = document.getElementById('toast'); if(!t) return;
      t.innerText = msg; t.style.display = 'block'; t.classList.add('show');
      setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>{ t.style.display='none'; },300); }, duration);
    }
    function createHeaderHtml(leftHtml='', title='', rightHtml='') { return `<div class="header">${leftHtml}<span style="margin-left:24px;">${title}</span>${rightHtml}</div>`; }

    function getChildrenList(){ if(!currentUser || !currentUser.children) return []; return currentUser.children.split(/[,、]/).map(c=>c.trim()).filter(c=>c!==''); }

    function parseRolesWithStatus(responseStr){
      if(!responseStr || responseStr==='不参加' || responseStr==='unselected') return [];
      const parts = responseStr.split(',').map(s=>s.trim()).filter(s=>s!=='');
      const out=[];
      for(let i=0;i<parts.length;i++){ let p=parts[i]; if(p==='0' || p==='1') continue; let next=parts[i+1]; if(next==='0' || next==='1'){ out.push({role:p,status:parseInt(next,10)}); i++; } else { out.push({role:p,status:0}); } }
      return out;
    }
    function stringifyRolesWithStatus(rolesArr){ if(!rolesArr || rolesArr.length===0) return "不参加"; return rolesArr.map(r=>`${r.role},${r.status}`).join(', '); }

    function isISODateString(s){ return typeof s==='string' && s.match(/^\d{4}-\d{2}-\d{2}/); }

    // ------------------------
    // Initial load
    // ------------------------
    window.onload = () => {
      const token = localStorage.getItem('my_token');
      if(!token) renderLoginView(); else fetchUserData(token);
    };

    // ------------------------
    // Authentication views
    // ------------------------
    function renderLoginView(msg=''){
      document.getElementById('app').innerHTML = `
        <div class="header"><span>総社ジュニアポータルアプリ</span></div>
        <div class="content login-box">
          <img src="https://raw.githubusercontent.com/sojajunior1982/portal/main/logo_01.png" alt="ロゴ" class="login-logo-img">
          <div class="login-logo">⚾総社ジュニアポータル⚾</div>
          <div class="login-subtitle">保護者のための連絡・出欠確認アプリ</div>
          <input type="text" id="userId" placeholder="ユーザーID (例: tanaka-p)">
          <input type="password" id="password" placeholder="パスワード">
          <button onclick="handleLogin()">ログイン</button>
          <div id="message">${msg}</div>
        </div>
      `;
    }

    async function handleLogin(){
      const userId = document.getElementById('userId').value;
      const password = document.getElementById('password').value;
      const msgEl = document.getElementById('message');
      if(!userId||!password){ if(msgEl) { msgEl.style.color='#ef4444'; msgEl.innerText='IDとパスワードは必須です'; } return; }
      msgEl.style.color='#2563eb'; msgEl.innerText='認証中...';
      const res = await apiPost({ action:'login', user_id:userId, password:password });
      if(res && res.success){ localStorage.setItem('my_token', res.token); currentUser = res.user; await fetchSchedules(); } else { msgEl.style.color='#ef4444'; msgEl.innerText = (res && res.message) ? res.message : '通信エラー'; }
    }

    async function fetchUserData(token){
      document.getElementById('app').innerHTML = `<div class="header"><span>総社ジュニアポータル</span></div><div class="content"><div class="loading"><div class="spinner"></div><div>自動ログイン中...</div></div></div>`;
      const res = await apiPost({ action:'auto_login', token });
      if(res && res.success){ currentUser = res.user; await fetchSchedules(); } else { localStorage.removeItem('my_token'); renderLoginView(); }
    }

    // ------------------------
    // Fetch schedules + attendances + defaults
    // ------------------------
    async function fetchSchedules(isInitial=true){
      if(isInitial) document.getElementById('app').innerHTML = `<div class="header"><span>総社ジュニアポータル</span></div><div class="content"><div class="loading"><div class="spinner"></div><div>予定を読み込み中...</div></div></div>`;
      const res = await apiPost({ action:'get_schedules', family_id: currentUser.family_id });
      if(res && res.success){
        rawSchedules = res.schedules || [];
        myAttendances = res.myAttendances || [];
        allAttendances = res.allAttendances || [];
        if(res.defaults){
          appDefaults = { tab: res.defaults.tab || appDefaults.tab, place: res.defaults.place || appDefaults.place, support: res.defaults.support || appDefaults.support };
          appDefaultsFull = res.defaultsFull || [];
        }
        groupSchedulesByDate();
        renderListView();
      } else {
        document.getElementById('app').innerHTML = `<div class="content"><p>データ取得エラー</p></div>`;
      }
    }

    function groupSchedulesByDate(){
      groupedSchedules = {};
      rawSchedules.forEach(item => { if(!groupedSchedules[item.date]) groupedSchedules[item.date]=[]; groupedSchedules[item.date].push(item); });
      for(const d in groupedSchedules) groupedSchedules[d].sort((a,b)=>(a.priority||0)-(b.priority||0));
    }

    // ------------------------
    // Notifications (改善1)
    // ------------------------
    function generateNotifications(){
      const now = new Date();
      const notifications = [];

      // 1) スケジュール更新（updated_atがあるもの）過去3日以内
      rawSchedules.forEach(ev => {
        if(!ev.update) return;
        let upd = new Date(ev.update);
        if(isNaN(upd.getTime())) upd = new Date(); // fallback
        const diffDays = (now - upd) / (1000*60*60*24);
        if(diffDays <= 3 && diffDays >= 0){
          const schedDate = ev.date ? new Date(ev.date) : null;
          const schedDateStr = schedDate && !isNaN(schedDate.getTime()) ? `${schedDate.getMonth()+1}月${schedDate.getDate()}日` : '日時不明';
          const msg = `${schedDateStr} の「${ev.tab_name}」が追加・更新されました。`;
          notifications.push({ time: upd.getTime(), date: schedDateStr, msg: msg });
        }
      });

      // 2) 自分の未回答（募集があり家の保護者回答がない場合）
      rawSchedules.forEach(ev => {
        const roles = ev.recruit_roles ? ev.recruit_roles.split(',').map(r=>r.trim()).filter(r=>r) : [];
        if(roles.length===0) return;
        const parentAns = myAttendances.find(a => String(a.schedule_id) === String(ev.schedule_id) && a.type === '保護者');
        if(!parentAns){
          const d = ev.date ? new Date(ev.date) : null;
          const dStr = d && !isNaN(d.getTime()) ? `${d.getMonth()+1}月${d.getDate()}日` : '該当日';
          const msg = `【個人】${dStr} の「${ev.tab_name}」で協力パパママを募集中です。ご協力お願いします！`;
          notifications.push({ time: Date.now(), date: dStr, msg: msg });
        }
      });

      notifications.sort((a,b)=>b.time-a.time);
      return notifications;
    }

    function getUnreadCount(notifications){
      const lastRead = Number(localStorage.getItem('lastReadTime'))||0;
      return notifications.filter(n=>n.time>lastRead).length;
    }

    function openNotifications(){
      const modal = document.getElementById('notiModal');
      if(modal) modal.style.display='flex';
      localStorage.setItem('lastReadTime', Date.now());
      const badge = document.querySelector('.bell-icon .badge'); if(badge) badge.style.display='none';
    }
    function closeNotifications(){ const modal=document.getElementById('notiModal'); if(modal) modal.style.display='none'; }

    // ------------------------
    // List view (改善1/6/7)
    // ------------------------
    function formatMonthTitle(){ return `${currentViewYear}年${currentViewMonth+1}月`; }
    function changeMonth(delta){ const d=new Date(currentViewYear, currentViewMonth+delta,1); currentViewYear=d.getFullYear(); currentViewMonth=d.getMonth(); renderListView(); }

    function renderListView(){
      currentActiveDate = null;
      const notiList = generateNotifications();
      const unread = getUnreadCount(notiList);
      const badgeHtml = unread>0 ? `<span class="badge">${unread}</span>` : '';

      let html = createHeaderHtml(`<button class="menu-btn" onclick="toggleSideMenu()">☰</button>`, '📅 スケジュール', `<div class="bell-icon" onclick="openNotifications()">🔔${badgeHtml}</div>`);
      html += `<div class="content">`;
      html += `<div class="month-selector"><button class="month-arrow" onclick="changeMonth(-1)">◀</button><div class="month-title">${formatMonthTitle()}</div><button class="month-arrow" onclick="changeMonth(1)">▶</button></div>`;

      // help / notification conditions (改善1 の説明を表示)
      html += `<div class="help-box">
        <div style="font-weight:700;margin-bottom:6px;">通知について（短縮）</div>
        <div>・スケジュールの追加/編集（最終更新が3日以内）→「○月○日 の『予定名』が追加・更新されました」と通知</div>
        <div>・募集項目がある予定であなたの家（保護者）の回答が未登録 → 個人通知を表示</div>
        <div style="margin-top:6px;color:#64748b;font-size:12px;">※未読は端末保存（lastReadTime）で管理しています</div>
      </div>`;

      // get dates in current view month
      const sortedDates = Object.keys(groupedSchedules).sort();
      let anyShown = false;
      sortedDates.forEach(date => {
        const dObj = isISODateString(date) ? new Date(date) : new Date(date);
        if(dObj.getFullYear()!==currentViewYear || dObj.getMonth()!==currentViewMonth) return; // filter by current month
        const events = groupedSchedules[date];
        if(!events || events.length===0) return;
        anyShown = true;
        const mainEvent = events[0];
        const dayStr = `${dObj.getMonth()+1}/${dObj.getDate()}`;
        const weekDays = ["日","月","火","水","木","金","土"];
        const weekStr = `(${weekDays[dObj.getDay()]})`;
        const isRecruiting = events.some(ev => hasRecruitingRoles(ev));
        const eventCountBadge = events.length>1 ? ` 他${events.length-1}件` : '';
        const hasNewUpdate = (typeof isNewUpdate === 'function') && events.some(event => {

            <button onclick="closeNotifications()" style="width:100%;margin-top:16px;padding:10px;background:#f1f5f9;color:#475569;border:none;border-radius:8px;font-weight:bold;">閉じる</button>

    function goToDetail(date){ currentActiveDate=date; currentActiveTabIndex=0; renderDetailView(date); }

    // ------------------------
    // hasRecruitingRoles (unchanged logic)
    // ------------------------
    function hasRecruitingRoles(schedule){
      const roles = schedule.recruit_roles ? schedule.recruit_roles.split(',').map(r=>r.trim()).filter(r=>r) : [];
      if(roles.length===0) return false;
      const atts = allAttendances.filter(a => String(a.schedule_id)===String(schedule.schedule_id) && a.type==='保護者');
      for(const role of roles){
        const isConfirmed = atts.some(a=>{
          const parsed = parseRolesWithStatus(a.response);
          return parsed.some(p=>p.role===role && p.status===1);
        });
        if(!isConfirmed) return true;
      }
      return false;
    }

    // ------------------------
    // Detail view (改善6: tabs ellipsis)
    // ------------------------

      const titleStr = `${d.getMonth()+1}月${d.getDate()}日の詳細`;

      let html = header + `<div class="content" style="display:flex;flex-direction:column;">`;

      events.forEach((ev, idx) => {
        const activeClass = idx===currentActiveTabIndex?'active':'';
        html += `<div class="tab ${activeClass}" id="tab-${idx}" onclick="switchTab(${idx}, ${events.length})">${ev.tab_name}</div>`;
      });
      html += `</div><div class="tab-content-box">`;

      let myResponsePanelsHtml = '';
      events.forEach((event, index) => {
        const activeClass = index===currentActiveTabIndex?'active':'';

        let childrenStatusRowsHtml = '';

            childrenStatusRowsHtml += `<div class="summary-row"><span style="color:#64748b;">団員 (${childName}):</span><span style="font-weight:bold;color:${childStatusText.includes('出席')?'#059669':'#ef4444'};">${childStatusText}</span></div>`;
          });
        } else childrenStatusRowsHtml = `<div class="summary-row"><span style="color:#94a3b8;">団員の情報がありません</span></div>`;

        const updateTime = event.update ? new Date(event.update).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'numeric',minute:'numeric'}) : '日時不明';
        const updater = event.updater ? `by ${event.updater}` : '';

        html += `<div class="tab-panel ${activeClass}" id="tab-panel-${index}">

                  <div class="detail-item"><div style="font-weight:600;">📍 ${event.location || '未定'}</div></div>
                  <div class="detail-item"><div style="color:#475569;font-size:14.5px;">📝 ${event.description || '詳細なし'}</div></div>
                  <div style="margin-top:24px;text-align:right;font-size:11px;color:#94a3b8;border-top:1px dashed #e2e8f0;padding-top:8px;">🔄 最終更新: ${updateTime} ${updater}</div>

        myResponsePanelsHtml += `<div class="my-response-panel" id="my-response-panel-${index}" style="display:${activeClass ? 'block':'none'};width:100%;">
          <div class="summary-status-bar" style="margin-top:0;margin-bottom:12px;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;border-bottom:1px solid #e2e8f0;padding-bottom:6px;">
              <span style="font-weight:bold;color:#334155;font-size:11.5px;">🙋‍♀️ わが家の現在の回答</span>
              <button onclick="openAllResponseModal('${event.schedule_id}')" style="background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;border-radius:8px;padding:4px 10px;font-size:11px;font-weight:bold;cursor:pointer;">👥 全員の回答</button>
            </div>
            ${childrenStatusRowsHtml}
            <div class="summary-row"><span style="color:#64748b;">保護者 (${currentUser.user_name}):</span><span style="font-weight:bold;color:${parentStatusText==='不参加'?'#64748b':'#0284c7'};">${parentStatusText}</span></div>
          </div>
        </div>`;
      });

      html += `</div>`; // tab-content-box
      html += `<div class="bottom-action-bar" style="flex-direction:column;">${myResponsePanelsHtml}
                <div style="display:flex;gap:10px;width:100%;">
                  <button class="fixed-btn fixed-btn-recruit" onclick="openFullResponseModal('保護者')">🙋‍♂️ 保護者のご協力<br><span style="font-size:11px;font-weight:normal;opacity:.9;">できること選ぶ！</span></button>
                  <button class="fixed-btn fixed-btn-absent" onclick="openFullResponseModal('団員')">🧒 団員の出欠連絡<br><span style="font-size:11px;font-weight:normal;opacity:.9;">連絡はこちらから</span></button>
                </div></div>`;

      document.getElementById('app').innerHTML = html;
    }

    function switchTab(activeIndex, totalTabs){
      currentActiveTabIndex = activeIndex;
      for(let i=0;i<totalTabs;i++){
        const tab = document.getElementById(`tab-${i}`);
        const panel = document.getElementById(`tab-panel-${i}`);
        const myRes = document.getElementById(`my-response-panel-${i}`);
        if(i===activeIndex){ tab && tab.classList.add('active'); panel && panel.classList.add('active'); if(myRes) myRes.style.display='block'; } else { tab && tab.classList.remove('active'); panel && panel.classList.remove('active'); if(myRes) myRes.style.display='none'; }
      }
    }

    // ------------------------
    // Full response modal (団員/保護者) — unchanged logic mostly
    // ------------------------
    function openFullResponseModal(type){
      const modalOverlay = document.getElementById('responseModal');
      const modalContent = document.getElementById('modalContent');
      const events = groupedSchedules[currentActiveDate] || [];
      const childrenList = getChildrenList();
      const title = type==='団員' ? "🧒 団員の出欠を連絡" : "🙋‍♂️ 協力パパママ募集中！";
      const subtitle = type==='団員' ? `対象: ${childrenList.join('・')}` : `対象: ${currentUser.user_name}`;
      tempAttendances=[]; let rowsHtml='';
      events.forEach((event, idx)=>{
        let selectorContentHtml='';
        if(type==='団員'){
          childrenList.forEach((childName,cIdx)=>{
            const existing = myAttendances.find(a=>String(a.schedule_id)===String(event.schedule_id) && a.type==='団員' && a.name===childName);
            const currentResponse = existing ? existing.response : "出席(自転車)";
            const currentComment = existing ? existing.comment||'' : '';
            tempAttendances.push({ schedule_id:String(event.schedule_id), name: childName, response: currentResponse, comment: currentComment });
            const opts = [{key:"出席(自転車)",text:"🚲出席(自転車)"},{key:"出席(送迎)",text:"🚗出席(送迎)"},{key:"欠席",text:"🔴お休み"},{key:"遅刻",text:"🟡遅刻"},{key:"早退",text:"🔵早退"}];
            let btnsHtml = `<div class="selector-group" style="flex-wrap:wrap;">`;
            opts.forEach(opt=>{
              const isActive = currentResponse===opt.key || (currentResponse==='出席' && opt.key==='出席(自転車)');
              const activeClass = isActive ? (opt.key.includes('出席')?'active-green':opt.key==='欠席'?'active-red':opt.key==='遅刻'?'active-yellow':'active-blue') : '';
              const btnStyle = opt.key.includes('出席') ? "flex:1 1 45%":"flex:1 1 28%";
              const safeChild = encodeURIComponent(childName);
              btnsHtml += `<button class="sel-btn ${activeClass}" style="${btnStyle}" id="btn-${event.schedule_id}-${safeChild}-${opt.key}" onclick="selectTempResponse('${event.schedule_id}','${opt.key}','団員','${childName}')">${opt.text}</button>`;
            });
            btnsHtml += `</div>`;
            selectorContentHtml += `<div class="${cIdx>0?'child-section':''}"><div class="child-name-badge">👤 ${childName}</div>${btnsHtml}<input type="text" class="modal-comment" id="modal-cmt-${event.schedule_id}-${childName}" placeholder="補足連絡（あれば）" value="${currentComment}" oninput="updateTempComment('${event.schedule_id}','${childName}', this.value)"></div>`;
          });
        } else {
          const existing = myAttendances.find(a=>String(a.schedule_id)===String(event.schedule_id) && a.type==='保護者');
          const parsed = existing ? parseRolesWithStatus(existing.response) : [];
          const currentComment = existing ? existing.comment||'' : '';
          tempAttendances.push({ schedule_id:String(event.schedule_id), name: currentUser.user_name, roles: parsed, comment: currentComment});
          const availableRoles = event.recruit_roles ? event.recruit_roles.split(',').map(r=>r.trim()).filter(r=>r) : [];
          if(availableRoles.length===0) selectorContentHtml = `<div style="font-size:12px;color:#94a3b8;text-align:center;padding:6px 0;">🤝 お手伝いは不要な予定です</div>`;
          else {
            const isUnused = parsed.length===0;
            let btnsHtml = `<button class="sel-btn sel-btn-full ${isUnused?'active-red':''}" id="btn-${event.schedule_id}-不参加" onclick="selectTempResponse('${event.schedule_id}','不参加','保護者')">❌ 今回は協力難しいです泣</button>`;
            btnsHtml += `<div class="selector-group" style="flex-direction:column;gap:8px;">`;
            availableRoles.forEach(role=>{
              const isSelected = parsed.some(p=>p.role===role);
              btnsHtml += `<button class="sel-btn sel-btn-full ${isSelected?'active-green':''}" style="margin-bottom:0;" id="btn-${event.schedule_id}-${role}" onclick="selectTempResponse('${event.schedule_id}','${role}','保護者', null, ${isSelected})">${role}</button>`;
            });
            btnsHtml += `</div>`;
            selectorContentHtml = btnsHtml;
            if(availableRoles.length>0) selectorContentHtml += `<input type="text" class="modal-comment" id="modal-cmt-${event.schedule_id}-${currentUser.user_name}" placeholder="理由や連絡（あればでOK）" value="${currentComment}" oninput="updateTempComment('${event.schedule_id}','${currentUser.user_name}', this.value)">`;
          }
        }
        rowsHtml += `<div class="modal-schedule-row"><div class="row-title">${idx+1}. ${event.tab_name}</div><div style="width:100%;">${selectorContentHtml}</div></div>`;
      });

      modalContent.innerHTML = `<div class="modal-header"><div class="modal-title">${title}</div><div class="modal-subtitle">${subtitle}</div></div>
        <div class="modal-body">${rowsHtml}</div>
        <div class="modal-footer"><button class="modal-footer-btn m-btn-cancel" onclick="closeFullResponseModal()">やめる</button><button class="modal-footer-btn m-btn-submit" onclick="submitAllResponses('${type}')">回答する！</button></div>`;
      modalOverlay.style.display='flex';
    }
    function closeFullResponseModal(){ document.getElementById('responseModal').style.display='none'; }

    function selectTempResponse(scheduleId,opt,type,targetName=null,isSelectedAlready=false){
      const target = tempAttendances.find(t=>String(t.schedule_id)===String(scheduleId) && (type==='保護者' || t.name===targetName));
      if(!target) return;
      if(type==='団員'){
        target.response = opt;
        const safe=encodeURIComponent(targetName); const btns=document.querySelectorAll(`[id^="btn-${scheduleId}-${safe}-"]`);
        btns.forEach(b=>{ b.className='sel-btn'; if(b.id===`btn-${scheduleId}-${safe}-${opt}`){ if(opt.includes('出席')) b.classList.add('active-green'); else if(opt==='欠席') b.classList.add('active-red'); else if(opt==='遅刻') b.classList.add('active-yellow'); else if(opt==='早退') b.classList.add('active-blue'); } });
      } else {
        if(opt==='不参加'){ target.roles=[]; }
        else {
          if(isSelectedAlready) target.roles = target.roles.filter(r=>r.role!==opt);
          else target.roles.push({ role: opt, status: 0 });
        }
        const btns=document.querySelectorAll(`[id^="btn-${scheduleId}-"]`);
        btns.forEach(b=>{
          b.className = b.className.includes('sel-btn-full') ? 'sel-btn sel-btn-full' : 'sel-btn';
          b.style.marginBottom = b.id.includes('不参加') ? '8px':'0';
          const roleName = b.id.replace(`btn-${scheduleId}-`,'');
          if(roleName==='不参加'){ if(target.roles.length===0) b.classList.add('active-red'); }
          else {
            const found = target.roles.find(r=>r.role===roleName);
            if(found){ b.classList.add('active-green'); b.setAttribute('onclick',`selectTempResponse('${scheduleId}','${roleName}','保護者',null,true)`); } else b.setAttribute('onclick',`selectTempResponse('${scheduleId}','${roleName}','保護者',null,false)`);
          }
        });
      }
    }
    function updateTempComment(scheduleId,name,text){ const t=tempAttendances.find(x=>String(x.schedule_id)===String(scheduleId)&&x.name===name); if(t) t.comment = text; }

    async function submitAllResponses(type){
      closeFullResponseModal();
      showToast('保存中...');
      for(const item of tempAttendances){
        const sendVal = type==='団員' ? item.response : stringifyRolesWithStatus(item.roles);
        const payload = { action:'submit_attendance', schedule_id:item.schedule_id, family_id: currentUser.family_id, name:item.name, type:type, response:sendVal, comment:item.comment||'' };
        await apiPost(payload).catch(e=>console.error('保存エラー',e));
      }
      await fetchSchedules(false);
      showToast('保存完了！');
    }

    // ------------------------
    // All response modal (unchanged majorly)
    // ------------------------
    function openAllResponseModal(scheduleId){ currentAllResScheduleId=scheduleId; renderAllResponseContent(); document.getElementById('allResponseModal').style.display='flex'; }
    function closeAllResponseModal(){ document.getElementById('allResponseModal').style.display='none'; }

    function renderAllResponseContent(){
      const event = rawSchedules.find(s=>String(s.schedule_id)===String(currentAllResScheduleId));
      if(!event) return;
      const atts = allAttendances.filter(a=>String(a.schedule_id)===String(currentAllResScheduleId));
      const childrenAtts = atts.filter(a=>a.type==='団員');
      const parentAtts = atts.filter(a=>a.type==='保護者');
      // sorting
      childrenAtts.sort((a,b)=>{
        if(currentAllResSort==='area'){ if(a.area_id!==b.area_id) return (a.area_id||'').localeCompare(b.area_id||'','ja'); }
        let numA=9999,numB=9999; const mA=a.name.match(/\[(\d+)\]/); const mB=b.name.match(/\[(\d+)\]/); if(mA) numA=parseInt(mA[1],10); if(mB) numB=parseInt(mB[1],10); if(numA!==numB) return numA-numB; return a.name.localeCompare(b.name,'ja');
      });
      const cGroups = { '出席':[], 'お休み':[], '遅刻':[], '早退':[] };
      childrenAtts.forEach(att=>{
        let res = att.response||'';
        let display = att.name;
        if(currentAllResSort==='area' && att.area_id) display = `<span class="area-badge">${att.area_id}</span> ${display}`;
        if(att.comment && att.comment.trim()!==''){ let sc = att.comment.replace(/\r?\n/g,' '); display += `<span style="cursor:pointer;margin-left:6px;" onclick="alert('${att.name}さんのコメント:\\n${sc}')">💬</span>`; }
        if(res.includes('出席')){ if(res.includes('自転車')) display += ' 🚲'; cGroups['出席'].push(display); }
        else if(res==='欠席' || res.includes('お休み')) cGroups['お休み'].push(display);
        else if(res.includes('遅刻')) cGroups['遅刻'].push(display);
        else if(res.includes('早退')) cGroups['早退'].push(display);
      });

      let parentsHtml='';
      const roles = event.recruit_roles ? event.recruit_roles.split(',').map(r=>r.trim()).filter(r=>r) : [];
      if(roles.length>0){
        roles.forEach(role=>{
          let assigned=[];
          parentAtts.forEach(p=>{
            const parsed=parseRolesWithStatus(p.response||'');
            const found = parsed.find(x=>x.role===role);
            if(found) assigned.push({ name:p.name, status:found.status, comment:p.comment });
          });
          assigned.sort((a,b)=>b.status-a.status || a.name.localeCompare(b.name,'ja'));
          const isConfirmed = assigned.some(a=>a.status===1);
          if(isConfirmed) assigned = assigned.filter(a=>a.status===1);
          const namesStr = assigned.length>0 ? assigned.map(a=>{ let base = `${a.status===1?'🌞 ':''}${a.name}`; if(a.comment && a.comment.trim()!==''){ let sc=a.comment.replace(/\r?\n/g,' '); base += `<span style="cursor:pointer;margin-left:6px;" onclick="alert('${a.name}さんのコメント:\\n${sc}')">💬</span>`; } return base; }).join('<br>') : '<span style="color:#94a3b8;font-size:12px;">なし</span>';
          const statusBadge = isConfirmed ? `<span style="color:#059669;font-size:11px;margin-left:6px;font-weight:bold;">[🌞確定]</span>` : `<span style="color:#d97706;font-size:11px;margin-left:6px;font-weight:bold;">[募集中]</span>`;
          const roleTitle = isConfirmed ? `✔️ ${role} ${statusBadge}` : `✔️ ${role} (${assigned.length}名) ${statusBadge}`;
          parentsHtml += `<div class="role-block"><div class="role-name">${roleTitle}</div><div style="padding-left:8px;">${namesStr}</div></div>`;
        });
      } else parentsHtml = '<div style="color:#94a3b8;font-size:12px;">今回は募集項目はありません</div>';

      const recruitingHeaderHtml = roles.length>0 && roles.some(r=> parentAtts.every(p=> !parseRolesWithStatus(p.response||'').some(pr => pr.role===r && pr.status===1) )) ? `<div style="background:#fffbeb;border:1px solid #fde68a;color:#b45309;padding:8px 12px;border-radius:8px;font-size:12px;margin-bottom:12px;font-weight:bold;">📢 募集中の項目があります</div>` : `<div style="background:#ecfdf5;border:1px solid #a7f3d0;color:#047857;padding:8px 12px;border-radius:8px;font-size:12px;margin-bottom:12px;font-weight:bold;">🎉 すべての協力パパママが確定しました！</div>`;

      document.getElementById('allResponseModalContent').innerHTML = `
        <div class="modal-header" style="display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid #e2e8f0;padding-bottom:12px;">
          <div><div class="modal-title" style="font-size:16px">${event.tab_name} の回答状況</div></div>
          <button onclick="closeAllResponseModal()" style="background:none;border:none;font-size:22px;color:#94a3b8;">×</button>
        </div>
        <div class="modal-body" style="padding:8px 16px;">
          ${recruitingHeaderHtml}
          <div class="sort-toggle-box"><div class="sort-btn ${currentAllResSort==='number'?'active':''}" onclick="toggleAllResSort('number')">背番号・名前順</div><div class="sort-btn ${currentAllResSort==='area'?'active':''}" onclick="toggleAllResSort('area')">自転車班</div></div>
          <div class="list-group"><div class="list-group-title">🧒 団員の回答</div><div class="list-group-content">
            <div style="color:#059669;font-weight:bold;margin-bottom:4px;">出席 (${cGroups['出席'].length}名)</div><div style="margin-bottom:12px;padding-left:8px;">${cGroups['出席'].length>0 ? cGroups['出席'].join('<br>') : '<span style="color:#94a3b8;">なし</span>'}</div>
            <div style="color:#ef4444;font-weight:bold;margin-bottom:4px;">お休み (${cGroups['お休み'].length}名)</div><div style="margin-bottom:12px;padding-left:8px;">${cGroups['お休み'].length>0?cGroups['お休み'].join('<br>'):'<span style="color:#94a3b8;">なし</span>'}</div>
            <div style="color:#d97706;font-weight:bold;margin-bottom:4px;">遅刻 (${cGroups['遅刻'].length}名)</div><div style="margin-bottom:12px;padding-left:8px;">${cGroups['遅刻'].length>0?cGroups['遅刻'].join('<br>'):'<span style="color:#94a3b8;">なし</span>'}</div>
            <div style="color:#2563eb;font-weight:bold;margin-bottom:4px;">早退 (${cGroups['早退'].length}名)</div><div style="padding-left:8px;">${cGroups['早退'].length>0?cGroups['早退'].join('<br>'):'<span style="color:#94a3b8;">なし</span>'}</div>
          </div></div>
          <div class="list-group"><div class="list-group-title">🙋‍♂️ パパママの協力</div><div class="list-group-content">${parentsHtml}</div></div>
        </div>
        <div class="modal-footer" style="padding:12px;"><button class="modal-footer-btn m-btn-cancel" style="background:#f1f5f9;color:#475569;" onclick="closeAllResponseModal()">閉じる</button></div>
      `;

    // renderConfirmRolesDetailView unchanged except the header logout removal
    function renderConfirmRolesDetailView(date, initMap=true){
      currentActiveDate = date;
      const events = groupedSchedules[date]||[];
      const d = new Date(date);
      const titleStr = `${d.getMonth()+1}/${d.getDate()} パパママ確定`;
      if(initMap){
        confirmStateMap={};
        events.forEach(ev=>{
          const atts = allAttendances.filter(a=>String(a.schedule_id)===String(ev.schedule_id) && a.type==='保護者');
          confirmStateMap[ev.schedule_id]={};
          atts.forEach(att=>{
            confirmStateMap[ev.schedule_id][att.family_id] = { name: att.name, roles: parseRolesWithStatus(att.response) };
          });
        });
      }
      let header = createHeaderHtml(`<button class="back-btn" onclick="renderConfirmRolesListView()">戻る</button>`, titleStr, '');
      let html = header + `<div class="content" style="display:flex;flex-direction:column;"><div class="tab-container">`;
      events.forEach((event,index)=>{ const activeClass = index===currentActiveTabIndex?'active':''; html += `<div class="tab ${activeClass}" id="tab-${index}" onclick="switchTab(${index}, ${events.length})">${event.tab_name}</div>`; });
      html += `</div><div class="tab-content-box" style="flex:1;">`;
      events.forEach((event,index)=>{
        const activeClass = index===currentActiveTabIndex?'active':'';
        const roles = event.recruit_roles ? event.recruit_roles.split(',').map(r=>r.trim()).filter(r=>r) : [];
        let rolesBlockHtml='';
        if(roles.length===0) rolesBlockHtml = `<p style="color:#94a3b8;text-align:center;padding:20px;">この予定に募集項目はありません</p>`;
        else {
          roles.forEach(role=>{
            let applicants=[];
            const scheduleState = confirmStateMap[event.schedule_id] || {};
            Object.keys(scheduleState).forEach(fId=>{
              const person = scheduleState[fId];
              const foundRole = person.roles.find(r=>r.role===role);
              if(foundRole) applicants.push({ family_id: fId, name: person.name, status: foundRole.status });
            });
            applicants.sort((a,b)=>b.status-a.status || a.name.localeCompare(b.name,'ja'));
            let rowsHtml='';
            if(applicants.length===0) rowsHtml = `<div style="font-size:12px;color:#94a3b8;padding:6px 0;">希望者なし</div>`;
            else {
              applicants.forEach(app=>{
                const isConfirmed = app.status===1;
                rowsHtml += `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed #f1f5f9;">
                  <span style="font-size:14px;font-weight:bold;color:#1e293b;">${isConfirmed ? '🌞 ' : ''}${app.name}</span>
                  <button class="confirm-toggle-btn ${isConfirmed ? 'is-confirmed' : ''}" onclick="toggleRoleConfirmation('${event.schedule_id}','${app.family_id}','${role}')">${isConfirmed ? '確定中 ✓' : '確定する'}</button>
                </div>`;
              });
            }
            rolesBlockHtml += `<div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin-bottom:12px;"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;"><span style="font-weight:800;font-size:14px;color:#1e3a8a;">✔️ ${role} (${applicants.length}名)</span><button onclick="selectAllForRole('${event.schedule_id}','${role}')" style="font-size:11px;background:#eff6ff;color:#2563eb;border:1px solid #93c5fd;padding:3px 8px;border-radius:6px;font-weight:bold;cursor:pointer;">全員確定</button></div>${rowsHtml}</div>`;
          });
        }
        html += `<div class="tab-panel ${activeClass}" id="tab-panel-${index}">${rolesBlockHtml}</div>`;
      });

      html += `</div><div style="padding:12px 16px 20px 16px;background:#fff;border-top:1px solid #e2e8f0;"><button onclick="submitConfirmations()" style="width:100%;padding:14px;background:linear-gradient(135deg,#7c3aed 0%,#6d28d9 100%);color:white;border:none;border-radius:12px;font-weight:bold;font-size:15px;box-shadow:0 4px 10px rgba(124,58,237,.3);cursor:pointer;">確定状況を保存する！</button></div></div>`;
      document.getElementById('app').innerHTML = html;
    }

    function toggleRoleConfirmation(scheduleId,familyId,role){
      const person = (confirmStateMap[scheduleId]||{})[familyId];
      if(!person) return;
      const targetRole = person.roles.find(r=>r.role===role);
      if(targetRole){ targetRole.status = targetRole.status===1?0:1; renderConfirmRolesDetailView(currentActiveDate, false); }
    }
    function selectAllForRole(scheduleId, role){
      const scheduleState = confirmStateMap[scheduleId] || {};
      Object.keys(scheduleState).forEach(fId => {
        const person = scheduleState[fId]; const target = person.roles.find(r=>r.role===role); if(target) target.status = 1;
      });
      renderConfirmRolesDetailView(currentActiveDate, false);
    }
    async function submitConfirmations(){
      showToast('確定状況を保存中...');
      const updates = [];
      Object.keys(confirmStateMap).forEach(sId=>{
        const sMap = confirmStateMap[sId];
        Object.keys(sMap).forEach(fId=>{
          const person = sMap[fId];
          updates.push({ schedule_id:sId, family_id:fId, name:person.name, response: stringifyRolesWithStatus(person.roles) });
        });
      });
      const res = await apiPost({ action:'save_confirmations', updates });
      if(res && res.success){ await fetchSchedules(false); showToast('保存完了！'); renderConfirmRolesListView(); } else alert('保存エラー: ' + (res?res.message:'通信エラー'));
    }

    // Update default priority by arrows (keeps compatibility)
    async function moveDefaultPriority(index, direction){
      // We will request the server to update, but to get the current items we rely on appDefaultsFull filtered
      const items = appDefaultsFull.filter(d=>d.type===currentDefaultType && Number(d.sort_order||d.order||0)!==0);
      if(index<0||index>=items.length) return;

    async function moveSchedulePriority(dateStr,index,direction){
      const evts = groupedSchedules[dateStr];

    function enableNativeDnD(containerId, itemSelector, getIdFromItem, onUpdate) {
      const container = document.getElementById(containerId);
      if (!container) return;

      let dragId = null;

      function setupItem(item) {
        item.draggable = true;
        item.addEventListener('dragstart', (e) => {
          dragId = getIdFromItem(item);
          e.dataTransfer.effectAllowed = 'move';
          try { e.dataTransfer.setData('text/plain', dragId); } catch (err) { /* some mobile browsers */ }
          item.classList.add('dragging');
        });

        item.addEventListener('dragover', (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          const rect = item.getBoundingClientRect();
          const midY = rect.top + rect.height / 2;
          if (e.clientY > midY) {
            item.style.borderBottom = '3px dashed #ccc';
            item.style.borderTop = '';
          } else {
            item.style.borderTop = '3px dashed #ccc';
            item.style.borderBottom = '';
          }
        });

        item.addEventListener('dragleave', () => {
          item.style.borderTop = item.style.borderBottom = '';
        });

        item.addEventListener('drop', async (e) => {
          e.preventDefault();
          item.style.borderTop = item.style.borderBottom = '';
          const draggedId = dragId || (e.dataTransfer && e.dataTransfer.getData && e.dataTransfer.getData('text/plain'));
          if (!draggedId) return;
          if (draggedId === getIdFromItem(item)) return; // dropped on itself

          const draggedEl = Array.from(container.querySelectorAll(itemSelector)).find(el => getIdFromItem(el) === draggedId);
          if (!draggedEl) return;

          // decide insert position based on pointer
          const rect = item.getBoundingClientRect();
          const after = (e.clientY > rect.top + rect.height / 2);
          if (after && item.nextSibling) container.insertBefore(draggedEl, item.nextSibling);
          else container.insertBefore(draggedEl, item);

          // rebuild ordered ids and call onUpdate
          const ordered = Array.from(container.querySelectorAll(itemSelector)).map(el => getIdFromItem(el));
          if (typeof onUpdate === 'function') {
            try { await onUpdate(ordered); } catch (err) { console.error('onUpdate error', err); }
          }
        });

        item.addEventListener('dragend', () => {
          item.classList.remove('dragging');
          container.querySelectorAll(itemSelector).forEach(i => { i.style.borderTop = i.style.borderBottom = ''; });
          dragId = null;
        });
      }

      // attach to existing items
      Array.from(container.querySelectorAll(itemSelector)).forEach(setupItem);

      // observe future mutations (if list re-rendered)
      const obs = new MutationObserver(() => {
        Array.from(container.querySelectorAll(itemSelector)).forEach(el => {
          if (!el._dnd_initialized) { setupItem(el); el._dnd_initialized = true; }
        });
      });
      obs.observe(container, { childList: true, subtree: false });
      // return a disposer
      return () => { obs.disconnect(); };
    }
