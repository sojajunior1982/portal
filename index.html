<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>総社ジュニア保護者ポータル</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/sojajunior1982/portal/main/logo_01.png">
    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbz2c7_4BqzbAcnj90yWS-e5iJ7ZMCtNbzuaQztCKTuRzd30tcT0eIFjBvymUI_t2LecQw/exec";
    </script>
    <style>
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; height: 100dvh; margin: 0; padding: 0; background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%); overflow: hidden; }
        body { display: flex; justify-content: center; align-items: center; }
        .app-container { background: #fafbfe; width: 100%; max-width: 390px; height: 100%; max-height: 844px; border-radius: 32px; box-shadow: 0 20px 40px rgba(0,0,0,0.15); display: flex; flex-direction: column; position: relative; border: 4px solid #ffffff; overflow: hidden; }
        @media (max-width: 480px) { .app-container { max-width: 100%; height: 100dvh; max-height: 100dvh; border-radius: 0; border: none; box-shadow: none; } }

        .header { background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); color: white; padding: 18px 16px; text-align: center; font-size: 17px; font-weight: 700; position: relative; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.15); flex-shrink: 0; z-index: 10; }
        .header.confirm-mode { background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%); box-shadow: 0 4px 12px rgba(124, 58, 237, 0.15); }
        .back-btn { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: white; background: rgba(255,255,255,0.2); border: none; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .logout-btn { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: white; background: rgba(255,255,255,0.15); border: none; padding: 6px 12px; border-radius: 20px; font-size: 11px; cursor: pointer; }
        .menu-btn { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: white; background: none; border: none; font-size: 22px; cursor: pointer; padding: 0; }

        .content { flex: 1; overflow-y: auto; padding: 16px; -webkit-overflow-scrolling: touch; }

        .login-box { padding: 20px 16px; text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; }
        .login-logo-img { width: 100px; height: 100px; border-radius: 22px; object-fit: cover; margin-bottom: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); }
        .login-logo { font-size: 24px; font-weight: 800; color: #1e3a8a; margin-bottom: 4px; }
        .login-subtitle { font-size: 13px; color: #64748b; margin-bottom: 25px; }
        .login-box input { width: 100%; padding: 14px 16px; margin-bottom: 16px; border: 1.5px solid #e2e8f0; border-radius: 14px; font-size: 15px; outline: none; background: #fff; }
        .login-box button { width: 100%; padding: 14px; background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); color: white; border: none; border-radius: 14px; cursor: pointer; font-size: 16px; font-weight: bold; box-shadow: 0 8px 16px rgba(37,99,235,0.25); }
        #message { margin-top: 15px; color: #ef4444; font-size: 13px; text-align: center; }

        .month-selector { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; background: #ffffff; padding: 10px 16px; border-radius: 14px; box-shadow: 0 4px 8px rgba(0,0,0,0.02); }
        .date-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 16px; margin-bottom: 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.01); }
        .date-text { font-size: 15px; font-weight: 700; color: #1e293b; }
        .status-badge { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 100px; }
        .status-recruiting { background: #fffbeb; color: #d97706; border: 1px solid #fde68a; }
        .status-confirmed { background: #ecfdf5; color: #059669; border: 1px solid #a7f3d0; }

        .tab-container { display: flex; gap: 6px; margin-bottom: 0; overflow-x: auto; padding-bottom: 0; flex-shrink: 0; }
        .tab { padding: 10px 18px; border-radius: 14px 14px 0 0; font-size: 13px; font-weight: 700; cursor: pointer; background: #e2e8f0; color: #475569; border: 1.5px solid #cbd5e1; border-bottom: none; white-space: nowrap; }
        .tab.active { background: #ffffff; color: #1e3a8a; border-color: #94a3b8; padding-bottom: 11px; margin-bottom: -1px; position: relative; z-index: 2; }

        .tab-content-box { background: #ffffff; border: 1.5px solid #cbd5e1; border-radius: 0 16px 16px 16px; padding: 16px; flex: 1; overflow-y: auto; box-shadow: 0 6px 12px rgba(0,0,0,0.01); margin-top: -1px; margin-bottom: 12px; }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }
        .detail-item { margin-bottom: 16px; }
        .detail-label { font-weight: 700; color: #64748b; font-size: 11px; margin-bottom: 4px; letter-spacing: 0.5px; }
        .detail-value { font-size: 15px; color: #1e293b; line-height: 1.5; white-space: pre-wrap; }
        .summary-status-bar { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; margin-top: 16px; font-size: 12.5px; }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 4px; }

        .bottom-action-bar { background: #ffffff; border-top: 1.5px solid #cbd5e1; padding: 12px 16px 20px 16px; display: flex; gap: 10px; flex-shrink: 0; z-index: 10; }
        .fixed-btn { flex: 1; padding: 12px 4px; border-radius: 14px; font-size: 13.5px; font-weight: bold; cursor: pointer; text-align: center; border: none; line-height: 1.4; }
        .fixed-btn-recruit { background: linear-gradient(135deg, #f97316 0%, #ea580c 100%); color: white; box-shadow: 0 4px 10px rgba(234, 88, 12, 0.2); }
        .fixed-btn-absent { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }

        .modal-overlay, .all-res-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(4px); z-index: 100; justify-content: center; align-items: flex-end; padding: 16px; }
        .modal { background: #ffffff; width: 100%; max-width: 358px; border-radius: 24px; box-shadow: 0 -4px 30px rgba(0,0,0,0.15); box-sizing: border-box; padding: 20px 16px; max-height: 80dvh; margin-bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); display: flex; flex-direction: column; overflow: hidden; animation: slideUp 0.25s cubic-bezier(0.1, 0.76, 0.55, 0.94); }
        @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal-header { text-align: center; margin-bottom: 14px; flex-shrink: 0; }
        .modal-title { font-size: 17px; font-weight: 800; color: #0f172a; }
        .modal-subtitle { font-size: 12.5px; color: #64748b; margin-top: 2px; }
        .modal-body { flex: 1; overflow-y: auto; padding-right: 2px; -webkit-overflow-scrolling: touch; }
        .modal-schedule-row { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 14px; padding: 12px; margin-bottom: 12px; }
        .row-title { font-size: 13.5px; font-weight: bold; color: #1e3a8a; margin-bottom: 8px; }

        .child-section { border-top: 1px dashed #cbd5e1; padding-top: 10px; margin-top: 10px; }
        .child-name-badge { font-size: 12px; font-weight: 700; color: #1d4ed8; margin-bottom: 6px; display: inline-block; background: #eff6ff; padding: 2px 8px; border-radius: 6px; }

        .selector-group { display: flex; gap: 6px; margin-bottom: 8px; width: 100%; }
        .sel-btn { flex: 1; padding: 10px 2px; border: 1.5px solid #cbd5e1; border-radius: 10px; background: #ffffff; color: #475569; font-size: 13px; font-weight: 700; cursor: pointer; text-align: center; }
        .sel-btn-full { width: 100%; margin-bottom: 8px; padding: 11px; box-sizing: border-box; }
        .sel-btn.active-green { background: #ecfdf5; border-color: #10b981; color: #047857; }
        .sel-btn.active-red { background: #fef2f2; border-color: #f87171; color: #b91c1c; }
        .sel-btn.active-yellow { background: #fffbeb; border-color: #fbbf24; color: #b45309; }
        .sel-btn.active-blue { background: #eff6ff; border-color: #60a5fa; color: #1d4ed8; }
        .modal-comment { width: 100%; padding: 10px; font-size: 12px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; box-sizing: border-box; background: #fff; }

        .modal-footer { padding-top: 12px; display: flex; gap: 10px; flex-shrink: 0; }
        .modal-footer-btn { flex: 1; padding: 13px; border-radius: 12px; font-weight: bold; font-size: 14px; border: none; text-align: center; cursor: pointer; }
        .m-btn-cancel { background: #f1f5f9; color: #475569; }
        .m-btn-submit { background: #2563eb; color: white; box-shadow: 0 4px 10px rgba(37, 99, 235, 0.2); }

        .toast { display: none; position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(100px); background: rgba(15, 23, 42, 0.9); color: white; padding: 10px 20px; border-radius: 50px; font-size: 12px; font-weight: bold; z-index: 999; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .loading { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; color: #64748b; font-weight: 500; gap: 12px; }
        .spinner { width: 32px; height: 32px; border: 3px solid #e2e8f0; border-top: 3px solid #2563eb; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .sort-toggle-box { display: flex; background: #f1f5f9; border-radius: 10px; padding: 4px; margin-bottom: 14px; flex-shrink: 0; }
        .sort-btn { flex: 1; text-align: center; font-size: 12px; font-weight: bold; padding: 8px; color: #64748b; cursor: pointer; border-radius: 8px; transition: 0.2s; }
        .sort-btn.active { background: #ffffff; color: #1e3a8a; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }

        .list-group { margin-bottom: 16px; }
        .list-group-title { font-size: 13.5px; font-weight: 800; color: #475569; margin-bottom: 6px; }
        .list-group-content { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; font-size: 13.5px; line-height: 1.6; }
        .area-badge { font-size: 10px; background: #cbd5e1; color: #334155; padding: 2px 6px; border-radius: 4px; margin-right: 6px; font-weight:bold; }

        #sideMenuOverlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; }
        #sideMenu { position: absolute; top: 0; left: -280px; width: 280px; height: 100%; background: white; z-index: 1000; transition: left 0.3s ease; box-shadow: 2px 0 8px rgba(0,0,0,0.15); display: flex; flex-direction: column; }

        .confirm-toggle-btn { font-size: 11px; padding: 4px 10px; border-radius: 20px; border: 1px solid #cbd5e1; background: #f1f5f9; color: #64748b; font-weight: bold; cursor: pointer; }
        .confirm-toggle-btn.is-confirmed { background: #ecfdf5; border-color: #10b981; color: #047857; }

        .bell-icon { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); font-size: 20px; cursor: pointer; color: white; }
        .badge { position: absolute; top: -4px; right: -6px; background: #ef4444; color: white; font-size: 10px; font-weight: bold; padding: 2px 5px; border-radius: 10px; border: 2px solid #1d4ed8; }
        .noti-modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:200; justify-content:center; align-items:center; padding:16px; }
        .noti-content { background:#fff; width:100%; max-width:340px; border-radius:16px; padding:20px; max-height:70dvh; overflow-y:auto; position:relative; }
        .noti-item { border-bottom: 1px solid #e2e8f0; padding: 10px 0; font-size: 13px; line-height: 1.5; color: #334155; }
        .noti-item:last-child { border-bottom: none; }
        .noti-date { font-size: 11px; color: #94a3b8; font-weight: bold; margin-bottom: 2px; }
    </style>
</head>
<body>

<div class="app-container" id="app"></div>

<div id="sideMenuOverlay" onclick="toggleSideMenu()"></div>
<div id="sideMenu">
    <div style="padding: 24px 20px; background: #f8fafc; border-bottom: 1px solid #e2e8f0;">
        <div style="font-size: 12px; color: #64748b; margin-bottom: 4px;">ログイン中</div>
        <div id="menuUserName" style="font-size: 16px; font-weight: bold; color: #1e293b;">-</div>
    </div>
    <div style="flex: 1; padding: 12px 0; overflow-y: auto;">
        <a href="#" onclick="navigateMenu('schedule'); return false;" style="display: block; padding: 14px 20px; color: #2563eb; font-weight: bold; background: #eff6ff; text-decoration: none; border-left: 4px solid #2563eb;">
            📅 スケジュール
        </a>
        <a href="#" onclick="navigateMenu('manageSchedule'); return false;" style="display: block; padding: 14px 20px; color: #334155; text-decoration: none; border-bottom: 1px solid #f1f5f9;">
            ⚙️ 予定の追加・管理
        </a>
        <a href="#" onclick="navigateMenu('confirmRoles'); return false;" style="display: block; padding: 14px 20px; color: #334155; text-decoration: none; border-bottom: 1px solid #f1f5f9;">
            🤝 協力パパママ確定
        </a>
        <a href="#" onclick="navigateMenu('documents'); return false;" style="display: block; padding: 14px 20px; color: #334155; text-decoration: none; border-bottom: 1px solid #f1f5f9;">
            各種資料
        </a>
        <a href="#" onclick="navigateMenu('admin'); return false;" style="display: block; padding: 14px 20px; color: #334155; text-decoration: none; border-bottom: 1px solid #f1f5f9;">
            管理者用
        </a>
    </div>

    <div style="padding: 16px; border-top: 1px solid #e2e8f0; text-align: center;">
        <button onclick="handleLogout()" style="background: #fee2e2; border: 1px solid #fca5a5; padding: 10px 16px; border-radius: 8px; color: #b91c1c; font-size: 14px; width: 100%; cursor: pointer; font-weight:bold; margin-bottom:10px;">ログアウト</button>
        <button onclick="toggleSideMenu()" style="background: #f1f5f9; border: none; padding: 10px 16px; border-radius: 8px; color: #64748b; font-size: 14px; width: 100%; cursor: pointer;">メニューを閉じる</button>
    </div>
</div>

<div class="modal-overlay" id="responseModal">
    <div class="modal" id="modalContent"></div>
</div>

<div class="toast" id="toast">保存しました！</div>

<div class="all-res-overlay" id="allResponseModal">
    <div class="modal" id="allResponseModalContent"></div>
</div>

<script>
    // -- State
    let currentUser = null;
    let rawSchedules = [];
    let myAttendances = [];
    let allAttendances = [];
    let groupedSchedules = {};
    let currentActiveDate = null;
    let currentActiveTabIndex = 0;
    let tempAttendances = [];
    let currentAllResSort = 'number';
    let currentAllResScheduleId = null;
    let appDefaultsFull = [];
    let appDefaults = {
        tab: ["練習", "練習（雨天時）", "練習試合", "試合"],
        place: ["小学校", "本球場"],
        support: ["🙆 参加", "🙋 当番", "🚗 道具車", "⚾ 審判"]
    };
    let confirmStateMap = {};

    // -- Utility helpers
    function createHeaderHtml(leftHtml = '', title = '', rightHtml = '') {
        return `<div class="header">${leftHtml}<span style="margin-left: 24px;">${title}</span>${rightHtml}</div>`;
    }

    async function apiPost(body) {
        try {
            const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(body) });
            return await res.json();
        } catch (e) {
            console.error('API error', e);
            return null;
        }
    }

    function showToast(msg, duration = 1500) {
        const toast = document.getElementById('toast');
        if (!toast) return;
        toast.innerText = msg;
        toast.style.display = 'block';
        toast.classList.add('show');
        setTimeout(() => {
            toast.classList.remove('show');
            setTimeout(() => { toast.style.display = 'none'; }, 300);
        }, duration);
    }

    function showLoading(msg) {
        document.getElementById('app').innerHTML = `
            <div class="header"><span>総社ジュニアポータル</span></div>
            <div class="content"><div class="loading"><div class="spinner"></div><div>${msg}</div></div></div>`;
    }

    function getChildrenList() {
        if (!currentUser || !currentUser.children) return [];
        return currentUser.children.split(/[,、]/).map(c => c.trim()).filter(c => c !== "");
    }

    // Parse string like "🙆 参加,0, 🙋 当番,1" => [{role, status}, ...]
    function parseRolesWithStatus(responseStr) {
        if (!responseStr || responseStr === '不参加' || responseStr === 'unselected') return [];
        const parts = responseStr.split(',').map(s => s.trim()).filter(s => s !== '');
        const result = [];
        for (let i = 0; i < parts.length; i++) {
            let p = parts[i];
            if (p === '0' || p === '1') continue;
            let next = parts[i + 1];
            if (next === '0' || next === '1') {
                result.push({ role: p, status: parseInt(next, 10) });
                i++;
            } else {
                result.push({ role: p, status: 0 });
            }
        }
        return result;
    }
    function stringifyRolesWithStatus(rolesArr) {
        if (!rolesArr || rolesArr.length === 0) return "不参加";
        return rolesArr.map(r => `${r.role},${r.status}`).join(', ');
    }

    function isNewUpdate(updateStr) {
        if (!updateStr) return false;
        const updateDate = new Date(updateStr);
        if (isNaN(updateDate.getTime())) return false;
        const now = new Date();
        const diffDays = (now - updateDate) / (1000 * 60 * 60 * 24);
        return diffDays >= 0 && diffDays <= 2;
    }

    // Group schedules by date and sort by priority
    function groupSchedulesByDate() {
        groupedSchedules = {};
        rawSchedules.forEach(item => {
            if (!groupedSchedules[item.date]) groupedSchedules[item.date] = [];
            groupedSchedules[item.date].push(item);
        });
        for (let date in groupedSchedules) groupedSchedules[date].sort((a, b) => (a.priority || 0) - (b.priority || 0));
    }

    // -- Authentication & initial load
    window.onload = function() {
        const token = localStorage.getItem('my_token');
        if (!token) { renderLoginView(); } else { fetchUserData(token); }
    };

    function renderLoginView(msg = '') {
        document.getElementById('app').innerHTML = `
            <div class="header"><span>総社ジュニアポータルアプリ</span></div>
            <div class="content login-box">
                <img src="https://raw.githubusercontent.com/sojajunior1982/portal/main/logo_01.png" alt="チームロゴ" class="login-logo-img">
                <div class="login-logo">⚾総社ジュニアポータル⚾</div>
                <div class="login-subtitle">保護者のための連絡・出欠確認アプリ</div>
                <input type="text" id="userId" placeholder="ユーザーID (例: tanaka-p)">
                <input type="password" id="password" placeholder="パスワード">
                <button onclick="handleLogin()">ログイン</button>
                <div id="message">${msg}</div>
            </div>
        `;
    }

    async function handleLogin() {
        const userId = document.getElementById('userId').value;
        const password = document.getElementById('password').value;
        const messageDiv = document.getElementById('message');
        if(!userId || !password) return;
        messageDiv.style.color = "#2563eb"; messageDiv.innerText = "認証中...";
        const result = await apiPost({ action: 'login', user_id: userId, password: password });
        if (result && result.success) {
            localStorage.setItem('my_token', result.token);
            currentUser = result.user;
            await fetchSchedules();
        } else {
            messageDiv.style.color = "#ef4444"; messageDiv.innerText = (result && result.message) ? result.message : "通信エラーが発生しました。";
        }
    }

    async function fetchUserData(token) {
        showLoading("自動ログイン中...");
        const loginResult = await apiPost({ action: 'auto_login', token });
        if (loginResult && loginResult.success) {
            currentUser = loginResult.user;
            await fetchSchedules();
        } else {
            localStorage.removeItem('my_token');
            renderLoginView();
        }
    }

    // -- Fetch schedules + defaults + attendances
    async function fetchSchedules(isInitial = true) {
        if (isInitial) showLoading("予定を読み込み中...");
        const schedResult = await apiPost({ action: 'get_schedules', family_id: currentUser.family_id });
        if (schedResult && schedResult.success) {
            rawSchedules = schedResult.schedules || [];
            myAttendances = schedResult.myAttendances || [];
            allAttendances = schedResult.allAttendances || [];
            if (schedResult.defaults) {
                appDefaults = {
                    tab: schedResult.defaults.tab || appDefaults.tab,
                    place: schedResult.defaults.place || appDefaults.place,
                    support: schedResult.defaults.support || appDefaults.support
                };
                appDefaultsFull = schedResult.defaultsFull || [];
            }
            groupSchedulesByDate();
            if (currentActiveDate !== null) renderDetailView(currentActiveDate); else renderListView();
        } else {
            document.getElementById('app').innerHTML = `<div class="content"><p>データ取得エラー</p></div>`;
        }
    }

    // -- Notifications
    function generateNotifications() {
    const now = new Date();
    const notifications = [];

    rawSchedules.forEach(ev => {
        if (!ev.update) return;

        const parts = ev.update.split(",");
        if (parts.length < 3) return;

        const upd = new Date(parts[0]);
        const action = parts[2];

        const diffDays = (now - upd) / (1000 * 60 * 60 * 24);
        if (diffDays > 3 || diffDays < 0) return;

        const d = new Date(ev.date);
        const dateStr = `${d.getMonth() + 1}月${d.getDate()}日`;

        let icon = "";
        let msg = "";

        switch (action) {
            case "created":
                icon = "📅";
                msg = `${dateStr}「${ev.tab_name}」が追加されました。`;
                break;

            case "updated":
                icon = "✏️";
                msg = `${dateStr}「${ev.tab_name}」が変更されました。`;
                break;

            case "deleted":
                icon = "🗑️";
                msg = `${dateStr}「${ev.tab_name}」が削除されました。`;
                break;

            default:
                return;
        }

        notifications.push({
            time: upd.getTime(),
            date: dateStr,
            msg: `${icon} ${msg}`
        });
    });

    notifications.sort((a, b) => b.time - a.time);
    return notifications;
}
    function getUnreadCount(notifications) {
        const lastReadTime = Number(localStorage.getItem('lastReadTime')) || 0;
        return notifications.filter(n => n.time > lastReadTime).length;
    }

    // -- Check if a schedule has recruiting roles needing confirmation
    function hasRecruitingRoles(schedule) {
        const roles = schedule.recruit_roles ? schedule.recruit_roles.split(',').map(r => r.trim()).filter(r => r !== "") : [];
        if (roles.length === 0) return false;
        const atts = allAttendances.filter(a => String(a.schedule_id) === String(schedule.schedule_id) && a.type === '保護者');
        for (let role of roles) {
            let isConfirmed = atts.some(a => {
                let parsed = parseRolesWithStatus(a.response);
                return parsed.some(p => p.role === role && p.status === 1);
            });
            if (!isConfirmed) return true;
        }
        return false;
    }

    function switchTab(activeIndex, totalTabs) {

                if (panel) panel.classList.remove('active');
                if (myResPanel) myResPanel.style.display = 'none';

    function selectTempResponse(scheduleId, opt, type, targetName = null, isSelectedAlready = false) {
        const target = tempAttendances.find(t => String(t.schedule_id) === String(scheduleId) && (type === '保護者' || t.name === targetName));
        if (!target) return;
        if (type === '団員') {
            target.response = opt;
            const safeChildId = encodeURIComponent(targetName);
            const btns = document.querySelectorAll(`[id^="btn-${scheduleId}-${safeChildId}-"]`);
            btns.forEach(b => {
                b.className = "sel-btn";
                if (b.id === `btn-${scheduleId}-${safeChildId}-${opt}`) {
                    if (opt.includes("出席")) b.classList.add("active-green");
                    if (opt === "欠席") b.classList.add("active-red");
                    if (opt === "遅刻") b.classList.add("active-yellow");
                    if (opt === "早退") b.classList.add("active-blue");
                }
            });
        } else {
            if (opt === '不参加') {
                target.roles = [];
            } else {
                if (isSelectedAlready) {
                    target.roles = target.roles.filter(r => r.role !== opt);
                } else {
                    target.roles.push({ role: opt, status: 0 });
                }
            }
            const btns = document.querySelectorAll(`[id^="btn-${scheduleId}-"]`);
            btns.forEach(b => {
                b.className = b.className.includes('sel-btn-full') ? "sel-btn sel-btn-full" : "sel-btn";
                b.style.marginBottom = b.id.includes('不参加') ? "8px" : "0";
                const roleName = b.id.replace(`btn-${scheduleId}-`, '');
                if (roleName === '不参加') {
                    if (target.roles.length === 0) b.classList.add('active-red');
                } else {
                    const found = target.roles.find(r => r.role === roleName);
                    if (found) {
                        b.classList.add('active-green');
                        b.setAttribute('onclick', `selectTempResponse('${scheduleId}', '${roleName}', '保護者', null, true)`);
                    } else {
                        b.setAttribute('onclick', `selectTempResponse('${scheduleId}', '${roleName}', '保護者', null, false)`);
                    }
                }
            });
        }
    }

    function updateTempComment(scheduleId, name, text) {
        const target = tempAttendances.find(t => String(t.schedule_id) === String(scheduleId) && t.name === name);
        if (target) target.comment = text;
    }

    async function submitAllResponses(type) {
        closeFullResponseModal();
        showToast("保存中...");
        for (let item of tempAttendances) {
            let sendVal = type === '団員' ? item.response : stringifyRolesWithStatus(item.roles);
            const payload = {
                action: 'submit_attendance',
                schedule_id: item.schedule_id,
                family_id: currentUser.family_id,
                name: item.name,
                type: type,
                response: sendVal,
                comment: item.comment
            };
            try { await apiPost(payload); } catch(e) { console.error("保存エラー", e); }
        }
        await fetchSchedules(false);
        showToast("保存完了！");
    }

    function renderAllResponseContent() {
        const event = rawSchedules.find(s => String(s.schedule_id) === String(currentAllResScheduleId));
        if (!event) return;
        const atts = allAttendances.filter(a => String(a.schedule_id) === String(currentAllResScheduleId));
        const childrenAtts = atts.filter(a => a.type === '団員');
        const parentAtts = atts.filter(a => a.type === '保護者');

        childrenAtts.sort((a, b) => {
            if (currentAllResSort === 'area') {
                if (a.area_id !== b.area_id) return (a.area_id || '').localeCompare(b.area_id || '', 'ja');
            }
            let numA = 9999, numB = 9999;
            const matchA = a.name.match(/\[(\d+)\]/);
            const matchB = b.name.match(/\[(\d+)\]/);
            if (matchA) numA = parseInt(matchA[1], 10);
            if (matchB) numB = parseInt(matchB[1], 10);
            if (numA !== numB) return numA - numB;
            return a.name.localeCompare(b.name, 'ja');
        });

        const cGroups = { '出席': [], 'お休み': [], '遅刻': [], '早退': [] };
        childrenAtts.forEach(att => {
            let res = att.response;
            let displayStr = att.name;
            if (currentAllResSort === 'area' && att.area_id) displayStr = `<span class="area-badge">${att.area_id}</span>` + displayStr;
            if (att.comment && att.comment.trim() !== "") {
                let safeComment = att.comment.replace(/\r?\n/g, ' ');
                displayStr += `<span style="cursor: pointer; font-size: 1.1em; margin-left: 5px;" onclick="alert('${att.name}さんのコメント:\\n${safeComment}')">💬</span>`;
            }
            if (res.includes('出席')) {
                if (res.includes('自転車')) displayStr += ' 🚲';
                cGroups['出席'].push(displayStr);
            } else if (res === '欠席' || res.includes('お休み')) {
                cGroups['お休み'].push(displayStr);
            } else if (res.includes('遅刻')) {
                cGroups['遅刻'].push(displayStr);
            } else if (res.includes('早退')) {
                cGroups['早退'].push(displayStr);
            }
        });

        let parentsHtml = '';
        const roles = event.recruit_roles ? event.recruit_roles.split(',').map(r => r.trim()).filter(r => r !== "") : [];
        if (roles.length > 0) {
            roles.forEach(role => {
                let assigned = [];
                parentAtts.forEach(p => {
                    let parsed = parseRolesWithStatus(p.response);
                    let found = parsed.find(item => item.role === role);
                    if (found) assigned.push({ name: p.name, status: found.status, comment: p.comment });
                });
                assigned.sort((a,b) => b.status - a.status || a.name.localeCompare(b.name, 'ja'));
                const isConfirmedRole = assigned.some(a => a.status === 1);
                if (isConfirmedRole) assigned = assigned.filter(a => a.status === 1);
                let namesStr = assigned.length > 0 ? assigned.map(a => {

    function renderConfirmRolesDetailView(date, initMap = true) {
        currentActiveDate = date;
        const events = groupedSchedules[date] || [];
        const d = new Date(date);
        const titleStr = `${d.getMonth() + 1}/${d.getDate()} パパママ確定`;

        if (initMap) {
            confirmStateMap = {};
            events.forEach(ev => {
                const atts = allAttendances.filter(a => String(a.schedule_id) === String(ev.schedule_id) && a.type === '保護者');
                confirmStateMap[ev.schedule_id] = {};
                atts.forEach(att => {
                    confirmStateMap[ev.schedule_id][att.family_id] = { name: att.name, roles: parseRolesWithStatus(att.response) };
                });
            });
        }

        let header = createHeaderHtml(`<button class="back-btn" onclick="renderConfirmRolesListView()">戻る</button>`, titleStr, '');
        let html = header + `<div class="content" style="display:flex; flex-direction:column;"><div class="tab-container">`;
        events.forEach((event, index) => {
            const activeClass = index === currentActiveTabIndex ? 'active' : '';
            html += `<div class="tab ${activeClass}" id="tab-${index}" onclick="switchTab(${index}, ${events.length})">${event.tab_name}</div>`;
        });
        html += `</div><div class="tab-content-box" style="flex:1;">`;

        events.forEach((event, index) => {
            const activeClass = index === currentActiveTabIndex ? 'active' : '';
            const roles = event.recruit_roles ? event.recruit_roles.split(',').map(r => r.trim()).filter(r => r !== "") : [];
            let rolesBlockHtml = "";
            if (roles.length === 0) {
                rolesBlockHtml = `<p style="color:#94a3b8; text-align:center; padding:20px;">この予定に募集項目はありません</p>`;
            } else {
                roles.forEach(role => {
                    let applicants = [];
                    const scheduleState = confirmStateMap[event.schedule_id] || {};
                    Object.keys(scheduleState).forEach(fId => {
                        const person = scheduleState[fId];
                        const foundRole = person.roles.find(r => r.role === role);
                        if (foundRole) applicants.push({ family_id: fId, name: person.name, status: foundRole.status });
                    });
                    applicants.sort((a,b) => b.status - a.status || a.name.localeCompare(b.name, 'ja'));
                    let rowsHtml = "";
                    if (applicants.length === 0) {
                        rowsHtml = `<div style="font-size:12px; color:#94a3b8; padding:6px 0;">希望者なし</div>`;
                    } else {
                        applicants.forEach(app => {
                            const isConfirmed = app.status === 1;
                            rowsHtml += `
                                <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px dashed #f1f5f9;">
                                    <span style="font-size:14px; font-weight:bold; color:#1e293b;">${isConfirmed ? '🌞 ' : ''}${app.name}</span>
                                    <button class="confirm-toggle-btn ${isConfirmed ? 'is-confirmed' : ''}" onclick="toggleRoleConfirmation('${event.schedule_id}', '${app.family_id}', '${role}')">
                                        ${isConfirmed ? '確定中 ✓' : '確定する'}
                                    </button>
                                </div>
                            `;
                        });
                    }
                    rolesBlockHtml += `<div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:12px; padding:12px; margin-bottom:12px;">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                            <span style="font-weight:800; font-size:14px; color:#1e3a8a;">✔️ ${role} (${applicants.length}名)</span>
                            <button onclick="selectAllForRole('${event.schedule_id}', '${role}')" style="font-size:11px; background:#eff6ff; color:#2563eb; border:1px solid #93c5fd; padding:3px 8px; border-radius:6px; font-weight:bold; cursor:pointer;">全員確定</button>
                        </div>
                        ${rowsHtml}
                    </div>`;
                });
            }
            html += `<div class="tab-panel ${activeClass}" id="tab-panel-${index}">${rolesBlockHtml}</div>`;
        });

        html += `</div>
            <div style="padding:12px 16px 20px 16px; background:#fff; border-top:1px solid #e2e8f0;">
                <button onclick="submitConfirmations()" style="width:100%; padding:14px; background:linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%); color:white; border:none; border-radius:12px; font-weight:bold; font-size:15px; box-shadow:0 4px 10px rgba(124,58,237,0.3); cursor:pointer;">確定状況を保存する！</button>
            </div>
        </div>`;

        document.getElementById('app').innerHTML = html;
    }

    function toggleRoleConfirmation(scheduleId, familyId, role) {
        const person = (confirmStateMap[scheduleId] || {})[familyId];
        if (!person) return;
        const targetRole = person.roles.find(r => r.role === role);
        if (targetRole) {
            targetRole.status = targetRole.status === 1 ? 0 : 1;
            renderConfirmRolesDetailView(currentActiveDate, false);
        }
    }

    function selectAllForRole(scheduleId, role) {
        const scheduleState = confirmStateMap[scheduleId] || {};
        Object.keys(scheduleState).forEach(fId => {
            const person = scheduleState[fId];
            const targetRole = person.roles.find(r => r.role === role);
            if (targetRole) targetRole.status = 1;
        });
        renderConfirmRolesDetailView(currentActiveDate, false);
    }

    async function submitConfirmations() {
        showToast("確定状況を保存中...");
        const updates = [];
        Object.keys(confirmStateMap).forEach(sId => {
            const sMap = confirmStateMap[sId];
            Object.keys(sMap).forEach(fId => {
                const person = sMap[fId];
                updates.push({
                    schedule_id: sId,
                    family_id: fId,
                    name: person.name,
                    response: stringifyRolesWithStatus(person.roles)
                });
            });
        });

        const result = await apiPost({ action: 'save_confirmations', updates });
        if (result && result.success) {
            await fetchSchedules(false);
            showToast("保存完了！");
            renderConfirmRolesListView();
        } else {
            alert("保存エラー: " + (result ? result.message : "通信エラー"));
        }
    }

    async function moveSchedulePriority(dateStr, index, direction) {
        const evts = groupedSchedules[dateStr];
        if (!evts || index < 0 || index >= evts.length) return;
        const targetIdx = index + direction;
        if (targetIdx < 0 || targetIdx >= evts.length) return;
        const temp = evts[index];
        evts[index] = evts[targetIdx];
        evts[targetIdx] = temp;
        let updates = [];
        evts.forEach((e, i) => { e.priority = (i + 1) * 10; updates.push({ schedule_id: e.schedule_id, priority: e.priority }); });
        renderScheduleListForDate(dateStr);
        try { await apiPost({ action: 'update_priorities', updates }); } catch(e) { console.error("優先順位の保存に失敗", e); }
    }

    async function submitScheduleForm() {
        const dateVal = document.getElementById('newDate').value;
        const tabVal = document.getElementById('newTabName').value;
        const scheduleIdVal = document.getElementById('editScheduleId').value;
        if (!dateVal || !tabVal) return alert("日付と予定の種類(タブ名)は必須です！");
        const checkedRoles = Array.from(document.querySelectorAll('.role-check:checked')).map(cb => cb.value);
        const customInputs = Array.from(document.querySelectorAll('.custom-role-input')).map(i => i.value.trim()).filter(v => v !== "");
        const finalRecruitRoles = [...checkedRoles, ...customInputs].join(',');
        const payload = {
            action: 'save_schedule',
            schedule_id: scheduleIdVal,
            date: dateVal,
            tab_name: tabVal,
            priority: document.getElementById('newPriority').value || 1,
            location: document.getElementById('newLocation').value,
            description: document.getElementById('newDescription').value,
            recruit_roles: finalRecruitRoles,
            user_name: currentUser.user_name
        };
        showLoading("スケジュールを保存中...");
        const result = await apiPost(payload);
        if (result && result.success) {
            showToast("保存完了！");
            await fetchSchedules(false);
            renderScheduleManagerView();
        } else {
            alert("保存エラー: " + (result ? result.message : "通信エラー"));
            renderScheduleForm(dateVal, scheduleIdVal);
        }
    }

    async function moveDefaultPriority(index, direction) {
        const items = appDefaultsFull.filter(d => d.type === currentDefaultType);
        if (index < 0 || index >= items.length) return;
        const targetIdx = index + direction;
        if (targetIdx < 0 || targetIdx >= items.length) return;
        const temp = items[index];
        items[index] = items[targetIdx];
        items[targetIdx] = temp;
        let updates = [];
        items.forEach((item, i) => { item.order = (i + 1) * 10; updates.push({ value: item.value, type: item.type, order: item.order }); });
        renderDefaultManagerView(currentDefaultType);
        await apiPost({ action: 'update_default_priorities', updates });
        await fetchSchedules(false);
    }

    async function deleteDefaultItem(value, type) {
        if (!confirm(`「${value}」を削除しますか？`)) return;
        showLoading("削除中...");
        const result = await apiPost({ action: 'delete_default', value, type });
        if (result && result.success) {
            showToast(result.message);
            await fetchSchedules(false);
            renderDefaultManagerView(type);
        } else {
            alert("削除に失敗しました");
            renderDefaultManagerView(type);
        }
    }

    function renderAccountForm(familyId) {
        let fam = { family_id: familyId || "新規採番(保存時に決定)", area_id: "", childrenList: [], accounts: [] };

        if (familyId) {
            let members = allAccounts.filter(a => a.family_id === familyId);

                fam.area_id = members[0].area_id;
                let cStr = members[0].children || "";
                let parts = cStr.split(',').filter(s=>s.trim());
                parts.forEach(p => {
                    let m = p.match(/\[(.*?)\](.*)/);
                    if (m) fam.childrenList.push({ number: m[1], name: m[2] });
                    else fam.childrenList.push({ number: "", name: p });
                });
                fam.accounts = members.map(m => ({
                    account: m.account, password_hash: m.password_hash, user_name: m.user_name,
                    role: m.role || 'user', created_at: m.created_at || '', isNew: false
                }));
            }
        } else {
            fam.childrenList.push({ number: "", name: "" });
            fam.accounts.push({ account: "", password_hash: "", user_name: "", role: "user", isNew: true });
        }

        currentEditFamily = fam;
        drawAccountForm();

    function addChild() { syncFormToCurrentEditFamily(); currentEditFamily.childrenList.push({ number: "", name: "" }); drawAccountForm(); }
    function removeChild(idx) { syncFormToCurrentEditFamily(); currentEditFamily.childrenList.splice(idx, 1); drawAccountForm(); }
    function addAccount() { syncFormToCurrentEditFamily(); currentEditFamily.accounts.push({ account: "", password_hash: "", user_name: "", role: "user", isNew: true }); drawAccountForm(); }
    function removeAccount(idx) { syncFormToCurrentEditFamily(); currentEditFamily.accounts.splice(idx, 1); drawAccountForm(); }

    function syncFormToCurrentEditFamily() {
        let fam = currentEditFamily;
        fam.area_id = document.getElementById('editAreaId').value;
        fam.childrenList.forEach((c, idx) => {
            let numEl = document.getElementById(`childNum_${idx}`);
            let nameEl = document.getElementById(`childName_${idx}`);
            if (numEl) c.number = numEl.value;
            if (nameEl) c.name = nameEl.value;
        });
        fam.accounts.forEach((acc, idx) => {
            let idEl = document.getElementById(`accId_${idx}`);
            let pwEl = document.getElementById(`accPw_${idx}`);
            let nameEl = document.getElementById(`accName_${idx}`);
            if (idEl) acc.account = idEl.value;
            if (pwEl && pwEl.value) acc.password_hash = pwEl.value; 
            if (nameEl) acc.user_name = nameEl.value;
        });
    }
    async function saveFamilyData() {
        syncFormToCurrentEditFamily();
        let fam = currentEditFamily;
        
        if (fam.accounts.length === 0) return alert("最低1つの保護者アカウントが必要です。");
        let hasError = false;
        fam.accounts.forEach(acc => {
            if (!acc.account) hasError = true;
            if (acc.isNew && !acc.password_hash) hasError = true;
            if (!acc.user_name) hasError = true;
        });
        if (hasError) return alert("アカウントID、パスワード(新規時)、表示名は必須です。");

        let childrenStrs = [];
        fam.childrenList.forEach(c => {
            if (c.name) {
                if (c.number) childrenStrs.push(`[${c.number}]${c.name}`);
                else childrenStrs.push(`${c.name}`);
            }
        });

        let payload = {
            action: 'save_family',
            family_id: fam.family_id === "新規採番(保存時に決定)" ? "" : fam.family_id,
            area_id: fam.area_id,
            children: childrenStrs.join(','),
            accounts: fam.accounts
        };

        showLoading("保存中...");
        try {
            let res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
            let result = await res.json();
            if (result.success) { showToast("保存完了！"); fetchAccounts(); }
            else { alert("エラー: " + result.message); drawAccountForm(); }
        } catch (e) { alert("通信エラー"); drawAccountForm(); }
    }

    async function deleteFamily(familyId) {
        if (!confirm("本当にこの家族のデータを全て削除しますか？\n（これまでのスケジュール等の参加データは残りますが、ログインできなくなります）")) return;
        showLoading("削除中...");
        try {
            let res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'delete_family', family_id: familyId }) });
            let result = await res.json();
            if (result.success) { showToast("削除しました"); fetchAccounts(); }
            else { alert("エラー: " + result.message); drawAccountForm(); }
        } catch (e) { alert("通信エラー"); drawAccountForm(); }
    }
    function renderDefaultForm(oldValue, type) {
        let isEdit = oldValue !== "";
        document.getElementById('app').innerHTML = `
            <div class="header">
                <button class="back-btn" onclick="renderDefaultManagerView('${type}')">戻る</button>
                <span>${isEdit ? '✏️ 編集' : '➕ 追加'}</span>
            </div>
            <div class="content" style="background:#f8fafc;">
                <div style="background:#fff; padding:16px; border-radius:12px;">
                    <label style="font-weight:bold; font-size:14px;">項目名</label>
                    <input type="text" id="defNewValue" value="${oldValue}">
                </div>
            </div>
        `;
    }

    async function submitDefaultForm() {
        const newValue = document.getElementById('defNewValue').value;
        const oldValue = document.getElementById('defOldValue').value;
        const type = document.getElementById('defType').value;
        if(!newValue) return alert("項目名を入力してください");

        showLoading("保存中...");
        let res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'save_default', old_value: oldValue, new_value: newValue, type: type }) });
        let result = await res.json();
        if (result.success) { showToast(result.message); await fetchSchedules(false); renderDefaultManagerView(type); }
        else alert(result.message);
    }

    async function deleteDefaultItem(value, type) {
        if(!confirm(`「${value}」を削除しますか？`)) return;
        showLoading("削除中...");
        let res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'delete_default', value: value, type: type }) });
        let result = await res.json();
        if (result.success) { showToast(result.message); await fetchSchedules(false); renderDefaultManagerView(type); }
        else alert(result.message);
    }

</script>
</body>
</html>
